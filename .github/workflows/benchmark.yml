name: Benchmark Workflow

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Git commit hash to checkout'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.commit_hash }}  # BENCHMARK: Use the commit hash input
        submodules: 'recursive'
        fetch-depth: 0
        fetch-tags: true

    - name: setup JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: gradle setup
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: "[dry-run] test"
      run: ./gradlew testFdroidDebug --dry-run
    
    - name: test
      run: ./gradlew testFdroidDebug
